<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>

    <span class="main">위치를 알려 주는 간판만 빈 간판으로</span><div class="arrow"></div>
    <span>얼굴 · 손은 그대로</span>

  <div class="clover" aria-hidden="true"><img src="../assets/clover/base-2.png" alt=""><img class="now" src="../assets/clover/leaf-2.png" alt=""></div><span class="clover-lab">해결<i>2 / 4</i></span>
