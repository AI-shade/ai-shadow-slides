<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 단계 띠 4칸 → 시연 영상 */

  .steps { display: flex; gap: 20px; }
  .steps .box { flex: 1; padding: 24px 32px; font-weight: 600; }

</style>
</head>
<body class="slide">
  <nav class="prog"><span class="done" style="--n:2"></span><span class="done" style="--n:2"></span><span class="on" style="--n:1"></span><span style="--n:3"></span></nav>
  <header>

    <h1>사진을 올리고, 위험을 보고, 고치고, 다시 확인합니다</h1>
  </header>

  <div class="steps">
    <div class="box">① 사진 올리기</div><div class="arrow"></div>
    <div class="box">② 위험 요소 지도</div><div class="arrow"></div>
    <div class="box on">③ 자동 보정</div><div class="arrow"></div>
    <div class="box">④ 재검증</div>
  </div>

  <div class="slot video">시연 영상 (2분)<span class="need" style="font-size:var(--foot)">[추가 자료 필요] 편집된 2분 시연 영상</span></div>
  <span class="pg">06</span>
</body>
</html>
