<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 3단 확장 계단(테스트 → 침투 → 성장), 단계마다 크게 · 진하게 · 하단: 원가 띠 */
  .stairs { flex: 1; }
  .stairs .lab { display: flex; align-items: center; gap: 12px; margin: 0; }
  .stairs b { font-size: var(--body); line-height: 1.3; }
  .s1 { background: var(--main-1); }
  .s2 { background: var(--main-2); }
  .s3 { background: var(--main); color: var(--bg); }
  .s3 .lab, .s3 .foot { color: var(--on-main); }
  .cost { background: var(--gray-2); border-radius: 20px; padding: 24px 32px; }
</style>
</head>
<body class="slide">
  <header>
    <p class="sec">Execution · 비즈니스 모델</p>
    <h1>무료 체험에서 과금으로, 부모에서 육아 인플루언서로</h1>
  </header>

  <div class="stairs">
    <div class="s1" style="height:56%">
      <span class="lab">테스트</span>
      <b>웹에서 무료 체험</b>
      <p class="foot">부모 누구나 · 사진 몇 장</p>
    </div>
    <div class="s2" style="height:76%">
      <span class="lab">침투 · B2C</span>
      <b>부모</b>
      <p class="foot">일정 장수부터 과금 · 가격 <span class="need">[추가 자료 필요]</span></p>
    </div>
    <div class="s3" style="height:100%">
      <span class="lab">성장 · B2B <span class="chip on">가설</span></span>
      <b>육아 인플루언서 · 키즈 모델 기획사</b>
      <p class="foot">아이 사진을 매일, 많은 사람에게 — 위험도 크고 낼 이유도 큼</p>
    </div>
  </div>

  <div class="cost">
    <span class="lab">원가</span>
    <p>진단 1장 약 <b>5.6원</b> (입력 2,611 · 출력 274 토큰) · 보정 단가 <span class="need">[추가 자료 필요]</span></p>
  </div>
  <span class="pg">09</span>
</body>
</html>
