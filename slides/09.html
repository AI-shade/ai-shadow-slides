<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 부모 · 사회 · 아이 3칸 → 비전(어두운 띠) */
  .three { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .three .box { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .three .box .lab { margin: 0; }
  .three b { font-size: 38px; line-height: 1.35; }
  .vision { background: var(--sub); color: var(--bg); border-radius: 24px; padding: 40px 48px; }
  .vision .lab { color: var(--on-main); }
  .vision p { font-size: 46px; font-weight: 800; line-height: 1.3; }
</style>
</head>
<body class="slide">
  <nav class="prog"><span class="done" style="--n:2"></span><span class="done" style="--n:2"></span><span class="done" style="--n:1"></span><span class="on" style="--n:3"></span></nav>
  <header>
    <p class="sec">기대 모습</p>
    <h1>올리기 전에 한 번 확인하는 것이 당연해지게 합니다</h1>
  </header>

  <div class="three">
    <div class="box"><span class="lab">부모</span><b>사진을 포기하지 않고, 위험한 곳만 고쳐 올립니다</b></div>
    <div class="box"><span class="lab">사회</span><b>올린 뒤 지우기의 앞 단계를 맡습니다</b><p class="foot">이미 퍼진 사진은 지워도 남습니다</p></div>
    <div class="box on"><span class="lab">아이</span><b>동의할 수 없는 아이의 사생활이 지켜집니다</b><p class="foot">아동 75.5% "사진 올릴 때 동의를 받은 적 없다" (세이브더칠드런 2021)</p></div>
  </div>

  <div class="vision">
    <span class="lab">비전</span>
    <p>부모가 올리는 사진에서도 아이의 사생활이 지켜지게 하겠습니다.</p>
  </div>
  <span class="pg">09</span>
</body>
</html>
