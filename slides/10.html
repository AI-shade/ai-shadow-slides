<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 감사합니다(크게) + 서비스 한 줄 · QR → 팀 한 줄 */
  .end { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.6fr 1fr; gap: 60px; align-items: center; }
  .end .left { display: flex; flex-direction: column; gap: 32px; }
  .end .thanks { font-size: 140px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .end .one { font-size: 40px; font-weight: 700; color: var(--main); }
  .end .qr { height: 460px; }
</style>
</head>
<body class="slide">
  <div class="end">
    <div class="left">
      <img src="../assets/ishadow-wordmark.svg" alt="아이SHADOW" style="height:64px;align-self:flex-start">
      <div class="thanks">감사합니다</div>
      <p class="one">아이는 그대로, 단서만 지웁니다 — 아이SHADOW</p>
    </div>
    <div class="slot qr">서비스 주소 · QR<span class="need">[추가 자료 필요]</span></div>
  </div>
  <p class="foot band">팀 네잎클로드 · 근오 · 영우 · 현미 · 윤서 · 민석</p>
  <span class="pg">10</span>
</body>
</html>
