<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 표지 겸 제품 소개: 좌 문제 한 줄 → 서비스 이름(가장 크게) → 하는 일 · 우 아이맥 한 대(웹 첫 화면이 위로 흘러가는 영상 assets/laptop/home-scroll.mp4 — child-main을 1440×810으로 녹화, 자가 점검 예시 사진은 흐리게. 영상을 못 트는 곳(PDF)은 home.png가 대신 보임) + 폰 한 대(진단 화면) · 아래 브랜드 */
  .slide { gap: 32px; }
  .cover { flex: 1; min-height: 0; display: grid; grid-template-columns: 0.95fr 1fr; gap: 32px; }
  .cover .left { display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .hook { font-size: 32px; font-weight: 700; color: var(--text-2); }
  .cover h1 { font-size: 62px; line-height: 1.22; }
  .does { font-size: 28px; line-height: 1.5; color: var(--text-2); }
  .flow { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; }
  .flow .arrow { flex: 0 0 48px; height: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .devices { position: relative; }
  /* 아이맥 목업: 흰 베젤 · 아래 턱(chin) · 얇은 받침대 */
  .imac { position: absolute; right: 0; top: 4%; width: 88%; z-index: 1; }
  .imac .body { border-radius: 14px; overflow: hidden; background: #f4f5f7; box-shadow: var(--shadow); border: 1px solid #d9dce1; }
  .imac .scr { margin: 8px 8px 0; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #000; }
  .imac .scr img, .imac .scr video { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .imac .chin { height: 42px; background: linear-gradient(180deg, #e9ebee, #d6d9de); margin-top: 8px; }
  .imac .neck { width: 18%; height: 110px; margin: 0 auto; background: linear-gradient(90deg, #c4c8cf, #e5e7ea 50%, #c4c8cf); clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); }
  .imac .foot { width: 30%; height: 8px; margin: 0 auto; background: linear-gradient(180deg, #d3d6db, #a9aeb6); border-radius: 4px 4px 10px 10px; box-shadow: 0 10px 18px rgba(20,30,60,.18); }
  .phone { position: absolute; left: 0; bottom: 2%; width: 30%; z-index: 2; aspect-ratio: 9 / 18.5; border-radius: 40px; border: 6px solid var(--sub); background: var(--gray-2); overflow: hidden; box-shadow: var(--shadow); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .brand img { height: 56px; }
</style>
</head>
<body class="slide">
  <p class="foot">[멋쟁이사자처럼] Campus AX-Ton 해커톤 본선 · 팀 네잎클로드 · 발표자 이영우</p>

  <div class="cover">
    <div class="left">
      <p class="hook">아이 사진 속 간판 하나가, 아이가 다니는 곳을 알려 줍니다</p>
      <h1>아동 사진 내 위치 단서<br>제거·보정 서비스,<br><span class="main">아이SHADOW</span></h1>
      <p class="does">사는 곳 · 다니는 곳을 알려 주는 단서를 찾아 표시하고,<br>아이는 그대로 둔 채 그 부분만 지우고 다시 그립니다.</p>
      <div class="flow"><span>찾기</span><div class="arrow"></div><span>지우고 보정</span><div class="arrow"></div><span class="main">다시 확인</span></div>
      <div class="chips"><span class="chip on">간판</span><span class="chip on">교복 · 원복</span><span class="chip">이름표</span><span class="chip">현수막</span><span class="chip">차량</span><span class="chip">가방</span></div>
    </div>
    <div class="devices">
      <div class="imac"><div class="body"><div class="scr"><video src="../assets/laptop/home-scroll.mp4" poster="../assets/laptop/home.png" autoplay loop muted playsinline aria-label="아이SHADOW 웹 첫 화면이 위로 흘러가는 영상"></video></div><div class="chin"></div></div><div class="neck"></div><div class="foot"></div></div>
      <div class="phone"><img src="../assets/phone/diagnose.png" alt="아이SHADOW 폰 진단 화면: 새 게시물에 사진을 올린 모습"></div>
    </div>
  </div>

  <div class="brand band">
    <img src="../assets/ishadow-wordmark.svg" alt="아이SHADOW">
    <img src="../assets/team-clover.png" alt="">
    <span class="foot">팀 네잎클로드</span>
  </div>
  <span class="pg">01</span>
</body>
</html>
