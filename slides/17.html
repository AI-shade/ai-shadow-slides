<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 마무리: 서브 색 바탕에 비전 한 줄(가장 크게) · 우 서비스 주소 QR · 아래 감사합니다 */
  .slide { gap: 36px; padding-top: 100px; }
  .end { flex: 1; min-height: 0; display: grid; }
  .vision { background: var(--sub); color: #fff; border-radius: 28px; padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 28px; } /* 글자 가운데 정렬(11-22) */
  .vision img { height: 64px; background: #fff; border-radius: 12px; padding: 8px 14px; }
  .vision .lab { color: var(--on-main); margin: 0; }
  .vision h1 { font-size: 64px; line-height: 1.25; }
  .vision h1 .need { color: #ffb4ab; }
  .vision p { font-size: 34px; font-weight: 700; color: var(--on-main); line-height: 1.4; }
  .vision .tag { color: #fff; font-weight: 800; }
  .bye { display: flex; align-items: center; gap: 32px; }
  .bye b { font-size: 52px; }
  /* 네잎클로버: 남색 상자 위에서는 반투명 가장자리가 깨져 보여 아래 흰 줄에 팀 서명처럼 둔다(표지 아래쪽과 같은 방식) */
  .sign { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; color: var(--text-2); }
  .sign img { width: 92px; height: auto; }
  html.play .sign img { animation: wiggle .9s .6s ease-in-out both; }
</style>
</head>
<body class="slide">
  <div class="end">
    <div class="vision">
      <img src="../assets/ishadow-wordmark.svg" alt="아이SHADOW">
      <h1>아이 곁의<br>그림자가 되겠습니다</h1>
      <p class="tag">올린 사진으로는 아이가 어디 있는지 알 수 없는 것이 상식인 사회,<br>그 사회를 향한 아이SHADOW의 시도</p>
    </div>
  </div>

  <div class="bye band">
    <span class="sign"><img src="../assets/team-clover.png" alt="">팀 네잎클로드</span>
  </div>
  <span class="pg">17</span>
</body>
</html>
