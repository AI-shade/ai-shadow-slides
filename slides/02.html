<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 나열형 두 칸: ① 숫자(부모 10명 그림) → ② 그래서 생긴 말(기사 두 장) · 아래 한 줄 */
  .two { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.35fr; gap: 32px; }
  .two .box { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .two .lab { margin: 0; }
  .people { width: 100%; height: auto; }
  .kpi { color: var(--main); font-size: 128px; }
  .say { font-size: 34px; font-weight: 700; line-height: 1.4; }
  .word { font-size: 80px; font-weight: 900; color: var(--main); line-height: 1; letter-spacing: -.02em; }
  .def { font-size: 28px; color: var(--text-2); line-height: 1.5; }
  .def b { color: var(--text); }
  .news { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .news figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .news img { flex: 1; min-height: 0; width: 100%; object-fit: cover; object-position: top; border-radius: 14px; border: 2px solid var(--line); background: #fff; }
  .so { display: flex; gap: 24px; align-items: baseline; }
  .so .lab { margin: 0; color: var(--main); white-space: nowrap; }
  .so b { font-size: 34px; }
</style>
</head>
<body class="slide">
  <header>
    <p class="sec">시장 · 셰어런팅</p>
    <h1>SNS 사용하시나요?</h1>
  </header>

  <div class="two">
    <div class="box">
      <span class="lab">① 부모의 SNS</span>
      <svg class="people" viewBox="0 0 1000 170" aria-hidden="true">
        <defs><linearGradient id="part"><stop offset="60%" stop-color="#0c8840"/><stop offset="60%" stop-color="#dfe3ea"/></linearGradient></defs>
        <g id="p"><circle cx="50" cy="34" r="26"/><rect x="18" y="70" width="64" height="96" rx="28"/></g>
        <g fill="#0c8840">
          <use href="#p" x="0"/><use href="#p" x="100"/><use href="#p" x="200"/><use href="#p" x="300"/>
          <use href="#p" x="400"/><use href="#p" x="500"/><use href="#p" x="600"/><use href="#p" x="700"/>
        </g>
        <use href="#p" x="800" fill="url(#part)"/>
        <use href="#p" x="900" fill="#dfe3ea"/>
      </svg>
      <span class="kpi">86.1%</span>
      <p class="say">SNS를 하는 부모 10명 중<br>8~9명이 아이 사진을 올립니다</p>
      <p class="foot" style="margin-top:auto">세이브더칠드런 조사(2021) · 만 0~11세 자녀 부모 1,000명</p>
    </div>

    <div class="box">
      <span class="lab">② 그래서 생긴 말</span>
      <span class="word">셰어런팅</span>
      <p class="def"><b>셰어(share) + 페어런팅(parenting)</b><br>부모가 아이 사진 · 영상을 SNS에 올리는 것</p>
      <div class="news">
        <figure><img src="../assets/news/kr3.png" alt=""><figcaption class="foot">뉴시스 · 2022.10.9</figcaption></figure>
        <figure><img src="../assets/news/kr1.png" alt=""><figcaption class="foot">노컷뉴스 · 2023.7.15</figcaption></figure>
      </div>
    </div>
  </div>

  <div class="clover" aria-hidden="true"><img src="../assets/clover/base-1.png" alt=""><img class="now" src="../assets/clover/leaf-1.png" alt=""></div><span class="clover-lab">문제<i>1 / 4</i></span>
  <span class="pg">02</span>
</body>
</html>
