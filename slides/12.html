<!doctype html>

<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 수익 모델 — 연결도: 가운데 원(아이SHADOW)으로 B2C 세 갈래 · B2B 세 갈래 선이 모임. 선 위 = 내는 방식.
     초록 실선 = 돈, 회색 점선 = 결제 없음. B2B 선이 더 굵음(매출의 중심 · 가설). 가격 숫자는 넣지 않음 */
  .slide { gap: 20px; }
  .sub { font-size: 30px; color: var(--text-2); font-weight: 700; }
  .net { width: 100%; height: auto; flex: 1; min-height: 0; }
  .why { display: flex; align-items: baseline; gap: 22px; }
  .why .lab { margin: 0; white-space: nowrap; }
  .why b { font-size: 26px; }
  .why b em { font-style: normal; color: var(--main); }
  .key { margin-left: auto; display: flex; gap: 22px; align-items: center; font-size: 20px; color: var(--text-3); font-weight: 700; white-space: nowrap; }
  .key i { display: inline-block; width: 38px; height: 0; border-top: 8px solid var(--main); border-radius: 4px; margin-right: 8px; vertical-align: middle; }
  .key i.no { border-top: 4px dashed #b8bfcb; }
</style>
</head>
