<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 나열형: 다섯 명 같은 모양 · 사진 → 이름 → 역할 → 한 일 → 나온 장 */
  .sub { font-size: 28px; color: var(--text-2); font-weight: 700; }
  .team { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
  .m { background: var(--gray-2); border-radius: 24px; padding: 30px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .m .face { width: 150px; height: 150px; border-radius: 50%; margin-bottom: 8px; font-size: 20px; }
  .m b { font-size: 40px; }
  .m .role { font-size: 24px; font-weight: 800; color: var(--main); }
  .m .did { font-size: 23px; color: var(--text-2); line-height: 1.5; }
  .m .at { margin-top: auto; font-size: 22px; font-weight: 700; color: var(--text-3); }
</style>
</head>
<body class="slide">
  <header>
    <p class="sec">팀원 · 누가 무엇을 했나</p>
    <h1><span class="need">[제목 미정]</span></h1>
    <p class="sub">지금까지 보여 드린 것을 한 사람들 · 팀 네잎클로드</p>
  </header>

  <div class="team">
    <div class="m"><div class="slot face">사진</div><b>근오</b><span class="role">수입구조</span><p class="did need">[한 일]</p><span class="at need">[나온 장]</span></div>
    <div class="m"><div class="slot face">사진</div><b>영우</b><span class="role">발표 · 마크 모델 학습 <span class="need">[확인]</span></span><p class="did">마크 모델 파인튜닝<br>(Roboflow · Colab)<br>학습 기록 정리</p><span class="at">→ 11장 모델 학습</span></div>
    <div class="m"><div class="slot face">사진</div><b>현미</b><span class="role">기획 · 발표자료 <span class="need">[확인]</span></span><p class="did">발표 설계 · 멘토링 정리<br>인스타 카드뉴스 <span class="need">[확인]</span></p><span class="at">→ 14장 마케팅</span></div>
    <div class="m"><div class="slot face">사진</div><b>윤서</b><span class="role">데이터 <span class="need">[확인]</span></span><p class="did">사진 503장에<br>가릴 곳 2,367곳 표시</p><span class="at">→ 10장 데이터 만들기</span></div>
    <div class="m"><div class="slot face">사진</div><b>민석</b><span class="role">데이터</span><p class="did need">[한 일]</p><span class="at need">[나온 장]</span></div>
  </div>
  <span class="pg">16</span>
</body>
</html>
