<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 대조형: 기존 웹 → 수정 후 (오른쪽만 강조) */
  .ba { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 72px 1fr; gap: 24px; align-items: stretch; }
  .ba .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .ba .lab { margin: 0; font-size: 28px; }
  .ba .slot { flex: 1; min-height: 0; font-size: 26px; }
  .ba .after .lab { color: var(--main); }
  .ba .after .slot { border: 6px solid var(--main); background: var(--main-1); }
  .ba .arrow { flex: none; width: 72px; height: 40px; background: linear-gradient(90deg, var(--line), var(--main)); }
</style>
</head>
<body class="slide">
  <header>
    <p class="sec">달라진 것 · 전과 후</p>
    <h1><span class="need">[제목 미정]</span></h1>
  </header>

  <div class="ba">
    <div class="col"><span class="lab">기존 웹</span><div class="slot">기존 웹 화면<span class="need">[캡처 필요]</span></div></div>
    <div class="arrow"></div>
    <div class="col after"><span class="lab">수정 후</span><div class="slot">수정 후 웹 화면<span class="need">[캡처 필요]</span></div></div>
  </div>
  <span class="pg">08</span>
</body>
</html>
