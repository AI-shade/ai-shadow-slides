<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<style>
  /* 타임라인: 네 시점(큰 숫자) 위 · 선과 점 · 한 일 한 줄 아래 · 맨 끝(결과)만 강조. 세부 설명은 말로 */
  .tl { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto 80px auto; row-gap: 14px; column-gap: 40px; align-content: center; padding-bottom: 40px; }
  .pt { position: relative; display: flex; align-items: center; }
  .pt::before { content: ""; position: absolute; left: 0; right: -40px; top: calc(50% - 4px); height: 8px; background: var(--line); }
  .pt.last::before { right: 0; background: linear-gradient(90deg, var(--line), var(--main)); }
  .when { font-size: 28px; font-weight: 700; color: var(--text-3); margin-bottom: 6px; }
  .num { font-size: 86px; font-weight: 900; line-height: 1.05; letter-spacing: -.02em; white-space: nowrap; }
  .num small { font-size: 32px; font-weight: 800; margin-left: 8px; }
  .dot { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); border: 8px solid var(--text-3); position: relative; z-index: 1; }
  .what { font-size: 40px; font-weight: 800; line-height: 1.3; }
  .what small { display: block; margin-top: 8px; font-size: 24px; font-weight: 700; color: var(--text-2); line-height: 1.35; }
  .last .num, .last .when, .what.last { color: var(--main); }
  .last .num { font-size: 72px; letter-spacing: -.03em; }
  .last .dot { border-color: var(--main); background: var(--main); box-shadow: 0 0 0 10px var(--main-2); }
</style>
</head>
<body class="slide">
  <header>
    <p class="sec">만든 과정 · 타임라인</p>
    <h1><span class="need">[제목 미정]</span></h1>
  </header>

  <div class="tl">
    <div><p class="when">8월 ~ 9.5 · 아이디어톤</p><p class="num">8.26<small>웹에 배포</small></p></div>
    <div><p class="when">10~11월 · 인터뷰 · 설문</p><p class="num">50<small>명</small></p></div>
    <div><p class="when">11월 · 멘토링</p><p class="num">503<small>장</small></p></div>
    <div class="last"><p class="when">마크 모델 붙인 뒤</p><p class="num">39%→79%</p></div>

    <span class="pt"><span class="dot"></span></span><span class="pt"><span class="dot"></span></span><span class="pt"><span class="dot"></span></span><span class="pt last"><span class="dot"></span></span>

    <p class="what">첫 버전을 만들어 배포</p>
    <p class="what">인터뷰 · 설문 진행<small>인터뷰 32명 · 설문 18명</small></p>
    <p class="what">마크 모델 직접 학습</p>
    <p class="what last">처음 보는 사진에서<br>간판을 알아본 비율</p>
  </div>
  <div class="clover" aria-hidden="true"><img src="../assets/clover/base-3.png" alt=""><img class="now" src="../assets/clover/leaf-3.png" alt=""></div><span class="clover-lab">검증<i>3 / 4</i></span>
  <span class="pg">07</span>
</body>
</html>
