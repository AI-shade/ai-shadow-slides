<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표</title>
<link rel="stylesheet" href="theme.css">
<style>
  #frame {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; border: 0;
    pointer-events: none; /* 방향키가 iframe에 먹히지 않게 포커스를 바깥에 둔다 */
  }
</style>
</head>
<body class="stage">
<iframe id="frame" tabindex="-1"></iframe>
<script>
  // 장을 늘리거나 빼면 이 목록만 고치세요.
  const slides = ['01','02','03','05','06','04','07','08','10'];  // 파일 번호가 아니라 이 순서로 띄운다 (09는 10에 합침)
  const frame = document.getElementById('frame');
  let i = Math.max(0, slides.indexOf(location.hash.slice(1)));

  function show() {
    frame.style.visibility = 'hidden';  // 다 읽힌 뒤 등장 효과와 함께 보이게
    frame.src = `slides/${slides[i]}.html?v=${Date.now()}`;  // 고친 장이 캐시에 막히지 않게
    history.replaceState(null, '', '#' + slides[i]);
  }
  // 발표 화면에서만 등장 효과를 켠다(theme.css의 html.play). 장 파일을 따로 열거나 PPT로 뽑을 땐 효과 없이 바로 보인다.
  frame.addEventListener('load', () => {
    try { frame.contentDocument.documentElement.classList.add('play'); } catch (e) {}
    frame.style.visibility = 'visible';
  });
  function go(d) { const n = Math.min(Math.max(i + d, 0), slides.length - 1); if (n !== i) { i = n; show(); } }
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.transform = `translate(-50%, -50%) scale(${s})`;
  }

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
    else return;
    e.preventDefault();
  });
  // 휠 · 화면 밀기로도 넘김 (한 번 넘긴 뒤 0.6초는 무시)
  let lock = 0;
  addEventListener('wheel', e => { const t = Date.now(); if (t < lock || Math.abs(e.deltaY) < 30) return; lock = t + 600; go(e.deltaY > 0 ? 1 : -1); }, { passive: true });
  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null; });
  addEventListener('resize', fit);
  fit();
  show();
</script>
</body>
</html>
