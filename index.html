<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이SHADOW 발표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #eef0f4; color: #1b2333; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }

  /* 위 막대 */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: rgba(238,240,244,.92); backdrop-filter: blur(6px); border-bottom: 1px solid #dde1e8; }
  .bar b { font-size: 16px; }
  .bar span { color: #6b7385; font-size: 13px; }
  .bar button { margin-left: auto; border: 0; border-radius: 8px; padding: 8px 14px; background: #0c8840; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .bar a { color: #4a5468; font-size: 13px; }

  /* 스크롤 보기: 17장을 위에서 아래로 */
  .list { max-width: 1200px; margin: 0 auto; padding: 24px 24px 120px; display: flex; flex-direction: column; gap: 28px; }
  .card { scroll-margin-top: 64px; }
  .card .cap { display: flex; gap: 10px; align-items: baseline; margin: 0 0 8px; font-size: 14px; color: #4a5468; }
  .card .cap b { font-size: 18px; color: #1b2333; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(20,30,60,.08); cursor: zoom-in; }
  .thumb iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .thumb:hover { outline: 3px solid #0c8840; }

  /* 발표 모드: 한 장씩 화면 가득 */
  .stage { position: fixed; inset: 0; z-index: 10; background: #111; display: none; }
  .stage.on { display: block; }
  .stage iframe { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; background: #fff; pointer-events: none; }
  .stage .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); color: #8890a0; font-size: 12px; opacity: 0; transition: opacity .3s; }
  .stage:hover .hint { opacity: 1; }

  @media (max-width: 600px) { .bar { padding: 10px 16px; } .bar span { display: none; } .list { padding: 16px 16px 80px; gap: 20px; } }
</style>
</head>
<body>
<div class="bar">
  <b>아이SHADOW 발표</b><span id="count"></span>
  <a href="blueprint.html">설계도</a>
  <button id="play">발표 모드 ▶</button>
</div>
<div class="list" id="list"></div>

<div class="stage" id="stage"><iframe id="frame" tabindex="-1"></iframe><div class="hint">← → 넘기기 · Esc 목록으로</div></div>

<script>
  // 장을 늘리거나 빼면 이 두 줄만 고치세요. 이 순서로 띄웁니다 (export.py도 slides 줄을 읽습니다).
  const slides = ['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15','16','17'];
  const names = ["표지", "시장 · 셰어런팅", "사례 · 해외와 국내", "시장 판도 · 우리 자리", "해결 방법 · 공정도", "시연", "만든 과정 · 타임라인", "달라진 것 · 전과 후", "공개 데이터로 위치 좁히기 · 시도", "마스킹 모델 학습 ① 데이터 만들기", "마스킹 모델 학습 ② 학습 · 결과", "수익 모델", "시장 진입 전략", "마케팅 · 실제로 해 본 것", "확장 계획", "팀원 · 누가 무엇을 했나", "비전 · 마무리"];

  const list = document.getElementById('list');
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  document.getElementById('count').textContent = `${slides.length}장 · 장을 누르면 그 장부터 발표 모드`;

  // ── 스크롤 보기 ──
  const thumbs = slides.map((id, i) => {
    const card = document.createElement('section');
    card.className = 'card'; card.id = id;
    card.innerHTML = `<p class="cap"><b>${id}</b>${names[i] || ''}</p><div class="thumb"><iframe loading="lazy" tabindex="-1" src="slides/${id}.html"></iframe></div>`;
    card.querySelector('.thumb').addEventListener('click', () => present(i));
    list.appendChild(card);
    return card.querySelector('.thumb');
  });
  const ro = new ResizeObserver(es => es.forEach(e => {
    e.target.firstElementChild.style.transform = `scale(${e.contentRect.width / 1920})`;
  }));
  thumbs.forEach(t => ro.observe(t));

  function current() {  // 화면 위쪽에 걸친 장
    const y = 80;
    let k = 0;
    thumbs.forEach((t, i) => { if (t.parentElement.getBoundingClientRect().top <= y) k = i; });
    return k;
  }

  // ── 발표 모드 ──
  let i = 0;
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  // 발표 모드에서만 등장 효과를 켠다(theme.css의 html.play). 목록 · PPT 내보내기에서는 효과 없이 바로 보인다.
  frame.addEventListener('load', () => { try { frame.contentDocument.documentElement.classList.add('play'); } catch (e) {} });
  function show() {
    frame.src = `slides/${slides[i]}.html`;
    history.replaceState(null, '', '#' + slides[i]);
  }
  function present(k) {
    i = k; stage.classList.add('on'); fit(); show();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }
  function leave() {
    stage.classList.remove('on');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.getElementById(slides[i]).scrollIntoView({ behavior: 'instant' });
  }
  function go(d) { const n = Math.min(Math.max(i + d, 0), slides.length - 1); if (n !== i) { i = n; show(); } }
  document.getElementById('play').addEventListener('click', () => present(current()));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && stage.classList.contains('on')) leave(); });

  addEventListener('keydown', e => {
    const on = stage.classList.contains('on');
    if (on) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
      else if (e.key === 'Escape') leave();
      else return;
    } else {
      if (e.key === 'p' || e.key === 'P' || e.key === 'F5') present(current());
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {  // 목록에서는 한 장씩 스크롤
        const k = Math.min(Math.max(current() + (e.key === 'ArrowRight' ? 1 : -1), 0), slides.length - 1);
        thumbs[k].parentElement.scrollIntoView();
      } else return;
    }
    e.preventDefault();
  });
  // 발표 모드에서 화면 밀기로 넘김
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null; });
  stage.addEventListener('click', e => go(e.clientX > innerWidth / 2 ? 1 : -1));
  addEventListener('resize', fit);

  // 주소 끝 #05 → 그 장으로 스크롤
  const start = slides.indexOf(location.hash.slice(1));
  if (start > 0) requestAnimationFrame(() => thumbs[start].parentElement.scrollIntoView({ behavior: 'instant' }));
</script>
</body>
</html>
